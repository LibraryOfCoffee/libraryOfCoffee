name: Deploy CS API
run-name: "Deploy to ${{ inputs.environment }} @${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境'
        required: true
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'イメージタグ (空の場合はコミットSHA)'
        required: false
        type: string

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  approve:
    name: Approve Deployment
    runs-on: ubuntu-latest
    environment: approve

    steps:
      - run: echo "Deployment to ${{ inputs.environment }} approved"

  build:
    name: Build and Push
    needs: approve
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ACCOUNT_ID }}-${{ inputs.environment }}-gha-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image tag already exists in ECR
        id: check-image
        run: |
          if aws ecr describe-images \
            --repository-name cs-api-${{ inputs.environment }} \
            --image-ids imageTag=${{ steps.set-tag.outputs.tag }} \
            --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image tag ${{ steps.set-tag.outputs.tag }} already exists. Skipping build and push."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/cs-api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cs-api-${{ inputs.environment }}:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/cs-api-${{ inputs.environment }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ACCOUNT_ID }}-${{ inputs.environment }}-gha-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch deployment parameters from SSM
        id: params
        run: |
          ENV="${{ inputs.environment }}"

          get_param() {
            aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text
          }

          DB_SECRET_ARN=$(get_param "/${ENV}/cs-api/db-secret-arn")
          RDS_ENDPOINT=$(get_param "/${ENV}/cs-api/rds-endpoint")

          echo "db_secret_arn=${DB_SECRET_ARN}" >> $GITHUB_OUTPUT
          echo "db_url=jdbc:mysql://${RDS_ENDPOINT}:3306/mametosho" >> $GITHUB_OUTPUT

      - name: Install ecspresso
        uses: kayac/ecspresso@v2
        with:
          version: v2.4.5

      - name: Deploy to ECS
        env:
          ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DB_URL: ${{ steps.params.outputs.db_url }}
          DB_SECRET_ARN: ${{ steps.params.outputs.db_secret_arn }}
        run: |
          ecspresso deploy \
            --config infrastructure/ecspresso/cs-api/ecspresso.yml
