openapi: 3.1.0
info:
  title: Admin API
  description: Library of Coffee - Admin API
  contact:
    name: Library of Coffee
  version: 1.0.0
servers:
- url: /
  description: Current Server
security:
- Bearer: []
tags:
- name: Plan
  description: プランAPI
- name: Taste
  description: テイストAPI
- name: Shop
  description: 店舗API
- name: Auth
  description: 認証API
- name: CoffeeBean
  description: コーヒー豆API
paths:
  /api/admin/shops/{id}:
    get:
      tags:
      - Shop
      summary: 店舗詳細取得
      description: 指定されたIDの店舗の詳細情報を取得します。
      operationId: getShop
      parameters:
      - name: id
        in: path
        description: 店舗ID
        required: true
        schema:
          type: string
        example: 00000000-0000-4000-8000-000000000001
      responses:
        "200":
          description: 取得成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopDetailResponse"
              examples:
                success:
                  summary: 取得成功例
                  description: success
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    shopifyShopId: test-shop-001
                    name: テスト珈琲店
                    introduction: こだわりの珈琲をお届けします。
                    particular: 厳選された豆のみを使用しています。
                    shopUrl: https://example.com
                    prefecture: TOKYO
                    publishStatus: PUBLISHED
                    images:
                    - id: 00000000-0000-4000-8000-000000000010
                      type: MAIN
                      imageUrl: https://example.com/shop-image.jpg
                    - id: 00000000-0000-4000-8000-000000000011
                      type: LOGO
                      imageUrl: https://example.com/shop-logo.png
        "404":
          description: 店舗が見つかりません
          content:
            '*/*':
              examples:
                not_found:
                  summary: 店舗が見つからない場合
                  description: not_found
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 404
                    error: Not Found
                    path: /api/admin/shops/00000000-0000-4000-8000-000000000999
    put:
      tags:
      - Shop
      summary: 店舗編集
      description: 指定されたIDの店舗を編集します。multipart/form-data形式で送信してください。全項目を置換します。ShopImageIdはサーバー側でUUIDv4を自動再生成します。
      operationId: updateShop
      parameters:
      - name: id
        in: path
        description: 店舗ID
        required: true
        schema:
          type: string
        example: 00000000-0000-4000-8000-000000000001
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/UpdateShopRequest"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - data
      responses:
        "200":
          description: 編集成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopResponse"
              examples:
                success:
                  summary: 編集成功例
                  description: success
                  value:
                    id: 00000000-0000-4000-8000-000000000001
        "400":
          description: バリデーションエラー
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_request:
                  summary: バリデーションエラーの場合
                  description: bad_request
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 400
                    error: Bad Request
                    path: /api/admin/shops/00000000-0000-4000-8000-000000000001
        "404":
          description: 店舗が見つかりません
          content:
            '*/*':
              examples:
                not_found:
                  summary: 店舗が見つからない場合
                  description: not_found
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 404
                    error: Not Found
                    path: /api/admin/shops/00000000-0000-4000-8000-999999999999
        "409":
          description: ShopifyショップIDが重複しています
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                conflict:
                  summary: ShopifyショップIDが重複している場合
                  description: conflict
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 409
                    error: Conflict
                    path: /api/admin/shops/00000000-0000-4000-8000-000000000001
    delete:
      tags:
      - Shop
      summary: 店舗削除
      description: 指定されたIDの店舗を削除します。店舗画像も同時に削除されます。
      operationId: deleteShop
      parameters:
      - name: id
        in: path
        description: 店舗ID
        required: true
        schema:
          type: string
        example: 00000000-0000-4000-8000-000000000001
      responses:
        "204":
          description: 削除成功
        "404":
          description: 店舗が見つかりません
          content:
            '*/*':
              examples:
                not_found:
                  summary: 店舗が見つからない場合
                  description: not_found
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 404
                    error: Not Found
                    path: /api/admin/shops/00000000-0000-4000-8000-999999999999
        "409":
          description: 関連するコーヒー豆が存在するため削除できません
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                conflict:
                  summary: 関連するコーヒー豆が存在する場合
                  description: conflict
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 409
                    error: Conflict
                    path: /api/admin/shops/00000000-0000-4000-8000-000000000001
