          description: "公開状態（DRAFT: 下書き / PUBLISHED: 公開）"
          example: PUBLISHED
        images:
          type: array
          description: 画像一覧
          items:
            $ref: "#/components/schemas/ImageDetail"
        tastes:
          type: array
          description: テイスト評価一覧
          items:
            $ref: "#/components/schemas/TasteDetail"
        isSpecialty:
          type: boolean
          description: スペシャルティコーヒーかどうか
          example: true
      required:
      - description
      - id
      - images
      - isSpecialty
      - name
      - origin
      - processingMethod
      - processingMethodName
      - publishStatus
      - roastLevel
      - shopId
      - shopName
      - shopifyBeanId
      - tastes
    TasteDetail:
      type: object
      description: テイスト評価詳細
      properties:
        id:
          type: string
          description: テイスト評価ID
          example: 00000000-0000-4000-8000-000000000020
        tasteId:
          type: string
          description: テイストマスタID
          example: 00000000-0000-4000-8000-000000000041
        tasteName:
          type: string
          description: テイスト名
          example: 酸味
        evaluationValue:
          type: integer
          format: int32
          description: 評価値（0-5）
          example: 4
      required:
      - evaluationValue
      - id
      - tasteId
      - tasteName
    ProcessingMethodResponse:
      type: object
      description: 精製方法
      properties:
        value:
          type: string
          description: 精製方法の値
          enum:
          - FULLY_WASHED
          - WASHED
          - ANAEROBIC_WASHED
          - THERMAL_SHOCK_NATURAL
          - NATURAL
          - ANAEROBIC_NATURAL
          - DRY_ON_TREE_NATURAL
          - LACTIC_NATURAL
          - WET_HULLING
          - HONEY
          - LADO_A_LADO_PROCESS
          - LADO_A_LADO_PROCESS_FULLY_WASHED
          example: WASHED
        label:
          type: string
          description: 精製方法の表示名
          example: ウォッシュド
      required:
      - label
      - value
  securitySchemes:
    Bearer:
      type: http
      description: JWTアクセストークン
      scheme: bearer
      bearerFormat: JWT
