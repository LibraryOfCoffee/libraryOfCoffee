  /api/admin/auth/login:
    post:
      tags:
      - Auth
      summary: ログイン
      description: メールアドレスとパスワードで認証し、JWTアクセストークンを返します。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: 認証成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                success:
                  summary: 認証成功例
                  description: success
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9...
                    tokenType: Bearer
                    expiresIn: 3600
        "401":
          description: 認証失敗
          content:
            '*/*':
              examples:
                unauthorized:
                  summary: メールアドレスまたはパスワードが不正な場合
                  description: unauthorized
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 401
                    error: Unauthorized
                    path: /api/admin/auth/login
