  /api/admin/shops:
    get:
      tags:
      - Shop
      summary: 店舗一覧取得
      description: 店舗の一覧をページネーション付きで取得します。店名による部分一致検索が可能です。画像は含まれません。
      operationId: listShops
      parameters:
      - name: page
        in: query
        description: ページ番号（0始まり）
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: 1ページあたりの件数
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      - name: name
        in: query
        description: 店名（部分一致検索）
        required: false
        schema:
          type: string
        example: 珈琲
      responses:
        "200":
          description: 取得成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopListResponse"
              examples:
                success:
                  summary: 取得成功例
                  description: success
                  value:
                    items:
                    - id: 00000000-0000-4000-8000-000000000001
                      shopifyShopId: test-shop-001
                      name: テスト珈琲店
                      introduction: こだわりの珈琲をお届けします。
                      particular: 厳選された豆のみを使用しています。
                      shopUrl: https://example.com
                      prefecture: TOKYO
                      participationStatus: PARTICIPATING
                    totalCount: 1
                    page: 0
                    size: 20
    post:
      tags:
      - Shop
      summary: 店舗登録
      description: 新しい店舗を登録します。multipart/form-data形式で送信してください。ShopIdおよびShopImageIdはサーバー側でUUIDv4を自動生成します。
      operationId: createShop
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/CreateShopRequest"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - data
      responses:
        "201":
          description: 登録成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopResponse"
              examples:
                success:
                  summary: 登録成功例
                  description: success
                  value:
                    id: 00000000-0000-4000-8000-000000000001
        "400":
          description: バリデーションエラー
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_request:
                  summary: バリデーションエラーの場合
                  description: bad_request
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 400
                    error: Bad Request
                    path: /api/admin/shops
        "409":
          description: ShopifyショップIDが重複しています
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                conflict:
                  summary: ShopifyショップIDが重複している場合
                  description: conflict
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 409
                    error: Conflict
                    path: /api/admin/shops
