openapi: 3.1.0
info:
  title: CS API
  description: Library of Coffee - Customer Service API
  contact:
    name: Library of Coffee
  version: 1.0.0
servers:
- url: /
  description: Current Server
tags:
- name: CoffeeListGroup
  description: 珈琲リストグループAPI
- name: CoffeeBean
  description: 珈琲豆API
paths:
  /api/coffeeBeans:
    get:
      tags:
      - CoffeeBean
      summary: 珈琲豆一覧取得
      description: 珈琲豆の一覧をページネーション付きで取得します。産地・焙煎度・精製方法でフィルタリングできます。
      operationId: listCoffeeBeans
      parameters:
      - name: page
        in: query
        description: ページ番号（0始まり）
        required: true
        schema:
          type: integer
          format: int32
        example: 0
      - name: size
        in: query
        description: 1ページあたりの件数
        required: true
        schema:
          type: integer
          format: int32
        example: 20
      - name: origin
        in: query
        description: 産地（部分一致）
        required: false
        schema:
          type: string
        example: エチオピア
      - name: roastLevel
        in: query
        description: 焙煎度（LIGHT/MEDIUM/CITY/FRENCH）
        required: false
        schema:
          type: string
        example: LIGHT
      - name: processingMethod
        in: query
        description: 精製方法（FULLY_WASHED/WASHED/THERMAL_SHOCK_NATURAL/NATURAL/WET_HULLING/HONEY）
        required: false
        schema:
          type: string
        example: WASHED
      responses:
        "200":
          description: 取得成功
          content:
            '*/*':
              examples:
                success:
                  summary: 取得成功例
                  description: success
                  value:
                    items:
                    - id: 00000000-0000-4000-8000-000000000071
                      name: エチオピア イルガチェフェ G1
                      origin: エチオピア
                      roastLevel: LIGHT
                      processingMethod: WASHED
                      isSpecialty: true
                    totalCount: 1
                    page: 0
                    size: 20
  /api/coffee-list-groups/{coffeeListGroupId}:
    get:
      tags:
      - CoffeeListGroup
      summary: 珈琲リストグループ詳細取得
      description: 指定されたIDの珈琲リストグループの詳細を取得します。グループに含まれる珈琲豆の情報（画像・テイスト評価を含む）を一括で返します。
      operationId: getCoffeeListGroupDetail
      parameters:
      - name: coffeeListGroupId
        in: path
        description: 珈琲リストグループID
        required: true
        schema:
          type: string
        example: 00000000-0000-4000-8000-000000000051
      responses:
        "200":
          description: 取得成功
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoffeeListGroupDetailResponse"
              examples:
                success:
                  summary: 取得成功例
                  description: success
                  value:
                    id: 00000000-0000-4000-8000-000000000051
                    description: 2026年2月のおすすめ珈琲豆
                    coffeeBeans:
                    - id: 00000000-0000-4000-8000-000000000071
                      name: エチオピア イルガチェフェ G1
                      description: 花のような華やかなフレーバーと、柑橘系の明るい酸味が特徴。クリーンカップで後味もすっきり。
                      origin: エチオピア
                      farm: イルガチェフェ コチャレ地区
                      roastLevel: light
                      processingMethod: washed
                      isSpecialty: true
                      images:
                      - id: 00000000-0000-4000-8000-000000000091
                        type: main
                        imageUrl: https://placehold.jp/150x150.png
                      tastes:
                      - tasteId: 00000000-0000-4000-8000-000000000041
                        tasteName: 酸味
                        evaluationValue: 5
                      - tasteId: 00000000-0000-4000-8000-000000000042
                        tasteName: 苦味
                        evaluationValue: 1
                      - tasteId: 00000000-0000-4000-8000-000000000043
                        tasteName: 甘味
                        evaluationValue: 3
                      - tasteId: 00000000-0000-4000-8000-000000000044
                        tasteName: コク
                        evaluationValue: 3
                      - tasteId: 00000000-0000-4000-8000-000000000045
                        tasteName: 香り
                        evaluationValue: 5
        "404":
          description: 珈琲リストグループが見つかりません
          content:
            '*/*':
              examples:
                not_found:
                  summary: リソースが見つからない場合
                  description: not_found
                  value:
                    timestamp: 2026-02-23T12:00:00.000+00:00
                    status: 404
                    error: Not Found
                    path: /api/coffee-list-groups/00000000-0000-4000-8000-000000000099
components:
  schemas:
    CoffeeBeanDetail:
      type: object
      description: 珈琲豆詳細
      properties:
        id:
          type: string
          description: 珈琲豆ID
          example: 00000000-0000-4000-8000-000000000071
        name:
          type: string
          description: 珈琲豆名
          example: エチオピア イルガチェフェ G1
        description:
          type: string
          description: 説明
          example: 花のような華やかなフレーバーと、柑橘系の明るい酸味が特徴。
        origin:
          type: string
          description: 産地
          example: エチオピア
        farm:
          type: string
          description: 農園
          example: イルガチェフェ コチャレ地区
        roastLevel:
          type: string
          description: 焙煎度
          example: light
        processingMethod:
          type: string
          description: 精製方法
          example: washed
        images:
          type: array
          description: 画像一覧
          items:
            $ref: "#/components/schemas/CoffeeBeanImageDetail"
        tastes:
          type: array
          description: テイスト評価一覧
          items:
            $ref: "#/components/schemas/CoffeeBeanTasteDetail"
        specialty:
          type: boolean
    CoffeeBeanImageDetail:
      type: object
      description: 珈琲豆画像
      properties:
        id:
          type: string
          description: 画像ID
          example: 00000000-0000-4000-8000-000000000091
        type:
          type: string
          description: 画像種別
          example: main
        imageUrl:
          type: string
          description: 画像URL
          example: https://placehold.jp/150x150.png
    CoffeeBeanTasteDetail:
      type: object
      description: 珈琲豆テイスト評価
      properties:
        tasteId:
          type: string
          description: テイストID
          example: 00000000-0000-4000-8000-000000000041
        tasteName:
          type: string
          description: テイスト名
          example: 酸味
        evaluationValue:
          type: integer
          format: int32
          description: 評価値（1〜5）
          example: 4
    CoffeeListGroupDetailResponse:
      type: object
      description: 珈琲リストグループ詳細レスポンス
      properties:
        id:
          type: string
          description: グループID
          example: 00000000-0000-4000-8000-000000000051
        description:
          type: string
          description: グループの説明
          example: 2026年2月のおすすめ珈琲豆
        coffeeBeans:
          type: array
          description: 珈琲豆一覧
          items:
            $ref: "#/components/schemas/CoffeeBeanDetail"
