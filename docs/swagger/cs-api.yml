openapi: 3.1.0
info:
  title: CS API
  description: Library of Coffee - Customer Service API
  contact:
    name: Library of Coffee
  version: 1.0.0
servers:
- url: /
  description: Current Server
tags:
- name: CoffeeBean
  description: 珈琲豆API
paths:
  /api/coffeeBeans:
    get:
      tags:
      - CoffeeBean
      summary: 珈琲豆一覧取得
      description: 珈琲豆の一覧をページネーション付きで取得します。産地・焙煎度・ロースターの都道府県でフィルタリングできます。
      operationId: listCoffeeBeans
      parameters:
      - name: page
        in: query
        description: ページ番号（0始まり）
        required: true
        schema:
          type: integer
          format: int32
        example: 0
      - name: size
        in: query
        description: 1ページあたりの件数
        required: true
        schema:
          type: integer
          format: int32
        example: 20
      - name: origin
        in: query
        description: 産地（部分一致）
        required: false
        schema:
          type: string
        example: エチオピア
      - name: roastLevel
        in: query
        description: 焙煎度
        required: false
        schema:
          type: string
          enum:
          - LIGHT
          - MEDIUM
          - CITY
          - FRENCH
        example: LIGHT
      - name: prefecture
        in: query
        description: ロースターの都道府県
        required: false
        schema:
          type: string
          enum:
          - HOKKAIDO
          - AOMORI
          - IWATE
          - MIYAGI
          - AKITA
          - YAMAGATA
          - FUKUSHIMA
          - IBARAKI
          - TOCHIGI
          - GUNMA
          - SAITAMA
          - CHIBA
          - TOKYO
          - KANAGAWA
          - NIIGATA
          - TOYAMA
          - ISHIKAWA
          - FUKUI
          - YAMANASHI
          - NAGANO
          - SHIZUOKA
          - AICHI
          - MIE
          - SHIGA
          - KYOTO
          - OSAKA
          - HYOGO
          - NARA
          - WAKAYAMA
          - TOTTORI
          - SHIMANE
          - OKAYAMA
          - HIROSHIMA
          - YAMAGUCHI
          - TOKUSHIMA
          - KAGAWA
          - EHIME
          - KOCHI
          - FUKUOKA
          - SAGA
          - NAGASAKI
          - KUMAMOTO
          - OITA
          - MIYAZAKI
          - KAGOSHIMA
          - OKINAWA
        example: TOKYO
      responses:
        "200":
          description: 取得成功
          content:
            '*/*':
              examples:
                success:
                  summary: 取得成功例
                  description: success
                  value:
                    items:
                    - id: 00000000-0000-4000-8000-000000000071
                      name: エチオピア イルガチェフェ G1
                      origin: エチオピア
                      roastLevel: LIGHT
                      processingMethod: WASHED
                      isSpecialty: true
                    totalCount: 1
                    page: 0
                    size: 20
components: {}
