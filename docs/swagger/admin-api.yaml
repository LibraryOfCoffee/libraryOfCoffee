openapi: 3.1.0
info:
  title: Admin API
  description: Library of Coffee - Admin API
  contact:
    name: Library of Coffee
  version: 1.0.0
servers:
- url: /
  description: Current Server
paths:
  /api/admin/samples/{id}:
    get:
      tags:
      - sample-controller
      operationId: getSampleById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SampleResponse"
components:
  schemas:
    SampleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
