spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  docker:
    compose:
      enabled: false

  security:
    enabled: false

# openapiプロファイルではHMACフィルタを無効化(Beanは@Profile("!openapi")で除外)。
# master-keyのプレースホルダ解決のためダミー値を置くだけで、実際には使用されない。
hmac:
  master-key: openapi-dummy-master-key-not-used

server:
  port: 8080

storage:
  s3:
    bucket-name: dummy
    region: ap-northeast-1
    base-url: http://localhost:4566/dummy

logging:
  level:
    root: WARN
    org.springframework.boot: INFO
