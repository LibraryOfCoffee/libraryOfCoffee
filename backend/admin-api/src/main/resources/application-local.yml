server:
  port: 8081

spring:
  sql:
    init:
      mode: always
      schema-locations: file:../../infrastructure/db/schema.sql
      data-locations: file:../../infrastructure/db/local-data.sql

  docker:
    compose:
      enabled: true
      file: ../compose.yml
      lifecycle-management: start-and-stop

jwt:
  secret-key: local-dev-secret-key-must-be-at-least-32-bytes-long-for-hs256
  expiration-seconds: 3600

storage:
  s3:
    bucket-name: library-of-coffee-images
    region: ap-northeast-1
    base-url: http://localhost:4566/library-of-coffee-images

logging:
  level:
    com.mametosho: DEBUG
    org.mybatis: DEBUG
